name: CI

on:
  pull_request:
  push:
    branches:
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        java-version: ["11", "21"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
          server-id: central
          server-username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          server-password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Build
        run: mvn -B clean install

      - name: Prepare test reports
        if: always()
        run: |
          if [ ! -d target/surefire-reports ]; then
            echo "No surefire reports found."
            exit 0
          fi

          mkdir -p build-reports/surefire-reports
          cp -r target/surefire-reports/. build-reports/surefire-reports/

          python3 .github/scripts/summarize_test_reports.py

      - name: Annotate test failures
        if: always() && hashFiles('build-reports/test-annotations.txt') != ''
        run: |
          while IFS= read -r line || [ -n "$line" ]; do
            echo "$line"
          done < build-reports/test-annotations.txt

      - name: Publish summary
        if: always()
        run: bash .github/scripts/publish_test_summary.sh

      - name: Upload build-reports
        if: always() && hashFiles('build-reports/surefire-reports/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-jdk${{ matrix.java-version }}
          path: build-reports/
          if-no-files-found: error
          retention-days: 14
