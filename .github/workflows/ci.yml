name: CI

on:
  push:
    branches:
      - "**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
          server-id: central
          server-username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          server-password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Build
        run: mvn -B clean install

      # Publish the Surefire JUnit results as a "Tests" check run — but ONLY when a test fails
      # (skip_success_summary + if: failure()), so a green run shows nothing. Same tool and
      # settings as core-cif-components' ci.yml and the venia test jobs.
      - name: Publish test results
        if: failure()
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Tests
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          skip_success_summary: true
          fail_on_failure: false

      - name: Upload surefire reports
        if: always() && hashFiles('**/target/surefire-reports/**') != ''
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 14
