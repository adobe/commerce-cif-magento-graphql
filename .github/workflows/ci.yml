name: CI

on:
  push:
    branches:
      - "**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Build
        run: mvn -B clean install

      # On a test failure only, write a pass/fail summary to the build job's Summary tab and
      # annotate the failing test(s). annotate_only avoids a second "Tests" check run that would
      # just duplicate this job's own status. Same tool/settings across venia, graphql, magento.
      - name: Publish test results
        if: failure()
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Tests
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          skip_success_summary: true
          annotate_only: true
          fail_on_failure: false

      - name: Upload surefire reports
        if: failure() && hashFiles('**/target/surefire-reports/**') != ''
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 14
